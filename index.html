
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>☁ Weather App</h1>
            <p>Check weather anywhere in the world</p>
        </header>

        
        <!-- Search Section -->
        <section class="search-section">

            <input
            type="text"
            id="cityInput"
            placeholder="Enter city name..."
            >

            <button id="searchBtn">Search</button>

            <button id="locationBtn">📍 My Location</button>

        </section>

        <p id="message"></p>


        
        <section class="weather-card">

            <h2 id="cityName">Search a city</h2>

            <div class="unit-toggle">
                <button id="celsiusBtn" class="active">°C</button>
                <button id="fahrenheitBtn">°F</button>
            </div>

            <div class="weather-info">

                <div>
                    <h1 id="temperature">--°C</h1>
                    <p id="weatherCondition">Weather condition</p>
                </div>

                <div class="weather-icon" id="weatherIcon">
                    🌤️
                </div>

            </div>

        </section>


        <!-- Weather Details -->
        <section class="details-section">

            <div class="detail-card">
                <h3>💧 Humidity</h3>
                <p id="humidity">65%</p>
            </div>

            <div class="detail-card">
                <h3>💨 Wind Speed</h3>
                <p id="windSpeed">12 km/h</p>
            </div>

            <div class="detail-card">
                <h3>🌡️ Feels Like</h3>
                <p id="feelsLike">30°C</p>
            </div>

        </section>

        <!-- Forecast Section -->
        <section class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div class="forecast-container" id="forecastContainer">

                <div class="forecast-card">
                    <h3>Monday</h3>
                    <p>☀️</p>
                    <p>30°C</p>
                </div>

                <div class="forecast-card">
                    <h3>Tuesday</h3>
                    <p>🌤️</p>
                    <p>28°C</p>
                </div>

                <div class="forecast-card">
                    <h3>Wednesday</h3>
                    <p>🌧️</p>
                    <p>25°C</p>
                </div>

                <div class="forecast-card">
                    <h3>Thursday</h3>
                    <p>⛅</p>
                    <p>27°C</p>
                </div>

                <div class="forecast-card">
                    <h3>Friday</h3>
                    <p>☀️</p>
                    <p>31°C</p>
                </div>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
